name: GitHub Profile 3D Contrib

# Generates a 3D contribution calendar SVG into profile-3d-contrib/
# and commits it back to the repo, where the README references it.

on:
  schedule:
    - cron: '0 18 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git commit -m "docs: update 3D contribution calendar" || echo "No changes"
          git push
