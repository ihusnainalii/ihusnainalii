<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 204" width="900" height="204">
<style>
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.7,.2,1) forwards}
.rot{opacity:0;animation:rot 16s infinite backwards}
.spot{opacity:0;animation:spot 14s infinite backwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes rot{0%{opacity:0;transform:translateY(8px)}4%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes spot{0%{opacity:0}2%,9%{opacity:1}12%,100%{opacity:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.5);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .rise,.rot.first{opacity:1}.draw{stroke-dashoffset:0}.grow{transform:none}.ring{opacity:0}.spot{display:none}.rot:not(.first){display:none}
}
</style>
<g class="rise" style="animation-delay:0.00s"><text x="28" y="58" font-size="56.0" font-weight="800" fill="#1f2328" letter-spacing="3" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">HUSNAIN ALI</text></g>
<g class="rot first" style="animation-delay:0s"><text x="28" y="98" font-size="22.4" font-weight="600" fill="#4f46e5" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Principal Software Engineer</text></g>
<g class="rot" style="animation-delay:4s"><text x="28" y="98" font-size="22.4" font-weight="600" fill="#4f46e5" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Senior iOS Engineer &amp; Mobile Architect</text></g>
<g class="rot" style="animation-delay:8s"><text x="28" y="98" font-size="22.4" font-weight="600" fill="#4f46e5" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Platform Engineer · DevSecOps</text></g>
<g class="rot" style="animation-delay:12s"><text x="28" y="98" font-size="22.4" font-weight="600" fill="#4f46e5" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">AWS DevOps Pro · Claude Certified Architect</text></g>
<rect class="blink" x="28" y="117" width="8" height="14" fill="#4f46e5"/>
<g class="rise" style="animation-delay:0.40s"><text x="46" y="128" font-size="13.4" font-weight="400" fill="#59636e" letter-spacing="0" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">ci/cd · kubernetes · devsecops · swift · aws · azure</text></g>
<line class="draw" pathLength="1" x1="28" y1="152" x2="872" y2="152" stroke="#d1d9e0" stroke-width="1" style="animation-delay:0.5s"/>
<g class="rise" style="animation-delay:0.70s"><text x="28" y="174" font-size="11.2" font-weight="400" fill="#59636e" letter-spacing="3" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">IOS &amp; SWIFT</text></g>
<g class="rise" style="animation-delay:0.80s"><text x="450.0" y="174" font-size="11.2" font-weight="400" fill="#59636e" letter-spacing="3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">CLOUD &amp; DEVOPS</text></g>
<g class="rise" style="animation-delay:0.90s"><text x="872" y="174" font-size="11.2" font-weight="400" fill="#59636e" letter-spacing="3" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">PLATFORM ENGINEERING</text></g>
<line class="draw" pathLength="1" x1="28" y1="186" x2="872" y2="186" stroke="#d1d9e0" stroke-width="1" style="animation-delay:0.9s"/>
</svg>
