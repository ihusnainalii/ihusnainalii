<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 461" width="900" height="461">
<style>
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.7,.2,1) forwards}
.rot{opacity:0;animation:rot 16s infinite backwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes rot{0%{opacity:0;transform:translateY(8px)}4%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.5);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .rise,.rot.first{opacity:1}.draw{stroke-dashoffset:0}.grow{transform:none}.ring{opacity:0}.rot:not(.first){display:none}
}
</style>
<g class="rise" style="animation-delay:0.00s"><text x="28" y="42" font-size="36" font-weight="700" fill="#4f46e5" letter-spacing="0" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">01</text></g>
<g class="rise" style="animation-delay:0.10s"><text x="90" y="38" font-size="12" font-weight="700" fill="#1f2328" letter-spacing="5" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">WHOAMI</text></g>
<line class="draw" pathLength="1" x1="181.0" y1="33" x2="783.2" y2="33" stroke="#d1d9e0" stroke-width="1" style="animation-delay:0.2s"/>
<g class="rise" style="animation-delay:0.30s"><text x="872" y="38" font-size="11" font-weight="400" fill="#59636e" letter-spacing="0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">~/01-whoami</text></g>
<g class="rise" style="animation-delay:0.30s"><text x="28" y="80" font-size="16" font-weight="400" fill="#1f2328" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Principal software engineer with 9+ years building scalable systems,</text></g>
<g class="rise" style="animation-delay:0.38s"><text x="28" y="107" font-size="16" font-weight="400" fill="#1f2328" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">working where mobile engineering meets cloud and DevOps.</text></g>
<g class="rise" style="animation-delay:0.46s"><text x="28" y="134" font-size="16" font-weight="400" fill="#1f2328" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Clean, modular, testable architecture and automated, secure delivery.</text></g>
<line class="draw" pathLength="1" x1="28" y1="171" x2="872" y2="171" stroke="#d1d9e0" stroke-width="1" style="animation-delay:0.54s"/>
<g class="rise" style="animation-delay:0.54s"><rect x="28" y="185" width="844" height="46" rx="8" fill="#f6f8fa"/><text x="46" y="213" font-size="11" font-weight="700" fill="#4f46e5" letter-spacing="2" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">MOBILE</text><text x="158" y="213" font-size="14" font-weight="400" fill="#1f2328" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">30+ native &amp; hybrid apps across FinTech, Healthcare, Aviation and AR/VR. 4.5+ App Store ratings.</text></g>
<g class="rise" style="animation-delay:0.62s"><rect x="28" y="239" width="844" height="46" rx="8" fill="#f6f8fa"/><text x="46" y="267" font-size="11" font-weight="700" fill="#4f46e5" letter-spacing="2" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">DEVOPS</text><text x="158" y="267" font-size="14" font-weight="400" fill="#1f2328" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">CI/CD, Infrastructure as Code and cloud-native architecture on AWS.</text></g>
<g class="rise" style="animation-delay:0.70s"><rect x="28" y="293" width="844" height="46" rx="8" fill="#f6f8fa"/><text x="46" y="321" font-size="11" font-weight="700" fill="#4f46e5" letter-spacing="2" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">ARCH</text><text x="158" y="321" font-size="14" font-weight="400" fill="#1f2328" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">MVVM-C, Clean, VIPER and TDD. Scaled to 100K+ users at under 2% crash rate.</text></g>
<g class="rise" style="animation-delay:0.78s"><rect x="28" y="347" width="844" height="46" rx="8" fill="#f6f8fa"/><text x="46" y="375" font-size="11" font-weight="700" fill="#4f46e5" letter-spacing="2" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">SECURITY</text><text x="158" y="375" font-size="14" font-weight="400" fill="#1f2328" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">PCI-DSS and HIPAA compliant infrastructure with shift-left scanning.</text></g>
<g class="rise" style="animation-delay:0.86s"><rect x="28" y="401" width="844" height="46" rx="8" fill="#f6f8fa"/><text x="46" y="429" font-size="11" font-weight="700" fill="#4f46e5" letter-spacing="2" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">NOW</text><text x="158" y="429" font-size="14" font-weight="400" fill="#1f2328" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Going deeper on Kubernetes and Platform Engineering. Writing on Medium.</text></g>
</svg>
