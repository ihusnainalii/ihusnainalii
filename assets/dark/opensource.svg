pple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">SwiftUI</text></g>
<g class="rise" style="animation-delay:0.45s"><rect x="28" y="226" width="844" height="132" rx="12" fill="#151b23" stroke="#30363d"/><text x="50" y="260" font-size="19.0" font-weight="700" fill="#e6edf3" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">SwiftLocalStorage</text><text x="850" y="260" font-size="11.2" font-weight="600" fill="#9198a1" letter-spacing="2" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">SWIFT PACKAGE</text><text x="50" y="286" font-size="14.6" font-weight="400" fill="#9198a1" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Type-safe local persistence and caching for Swift. Store existing Codable DTOs with</text><text x="50" y="307" font-size="14.6" font-weight="400" fill="#9198a1" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">SwiftData, no @Model needed. Cache expiry, queries, live observation, migrations.</text><rect x="50" y="322" width="87" height="24" rx="12" fill="none" stroke="#22d3ee" opacity=".6"/><text x="93.27199999999999" y="338" font-size="12.3" font-weight="600" fill="#22d3ee" letter-spacing="0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">SwiftData</text><rect x="145" y="322" width="71" height="24" rx="12" fill="none" stroke="#22d3ee" opacity=".6"/><text x="180.2" y="338" font-size="12.3" font-weight="600" fill="#22d3ee" letter-spacing="0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Caching</text><rect x="224" y="322" width="117" height="24" rx="12" fill="none" stroke="#22d3ee" opacity=".6"/><text x="282.36" y="338" font-size="12.3" font-weight="600" fill="#22d3ee" letter-spacing="0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Offline-first</text></g>
<g class="rise" style="animation-delay:0.60s"><rect x="28" y="372" width="844" height="132" rx="12" fill="#151b23" stroke="#30363d"/><text x="50" y="406" font-size="19.0" font-weight="700" fill="#e6edf3" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">LocalConsoleSwift</text><text x="850" y="406" font-size="11.2" font-weight="600" fill="#9198a1" letter-spacing="2" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">SWIFT PACKAGE</text><text x="50" y="432" font-size="14.6" font-weight="400" fill="#9198a1" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">On-device debug console for iOS: a draggable, resizable PiP overlay that mirrors print()</text><text x="50" y="453" font-size="14.6" font-weight="400" fill="#9198a1" letter-spacing="0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">output and inspects view frames, right inside your live app.</text><rect x="50" y="468" width="71" height="24" rx="12" fill="none" stroke="#22d3ee" opacity=".6"/><text x="85.656" y="484" font-size="12.3" font-weight="600" fill="#22d3ee" letter-spacing="0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Swift 6</text><rect x="129" y="468" width="87" height="24" rx="12" fill="none" stroke="#22d3ee" opacity=".6"/><text x="172.584" y="484" font-size="12.3" font-weight="600" fill="#22d3ee" letter-spacing="0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Debugging</text><rect x="224" y="468" width="71" height="24" rx="12" fill="none" stroke="#22d3ee" opacity=".6"/><text x="259.512" y="484" font-size="12.3" font-weight="600" fill="#22d3ee" letter-spacing="0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">SwiftUI</text></g>
