<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80">
<style>
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.7,.2,1) forwards}
.rot{opacity:0;animation:rot 16s infinite backwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes rot{0%{opacity:0;transform:translateY(8px)}4%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.5);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .rise,.rot.first{opacity:1}.draw{stroke-dashoffset:0}.grow{transform:none}.ring{opacity:0}.rot:not(.first){display:none}
}
</style>
<g class="rise" style="animation-delay:0.00s"><text x="28" y="42" font-size="40.3" font-weight="700" fill="#22d3ee" letter-spacing="0" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">07</text></g>
<g class="rise" style="animation-delay:0.10s"><text x="90" y="38" font-size="13.4" font-weight="700" fill="#e6edf3" letter-spacing="5" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">ACTIVITY</text></g>
<line class="draw" pathLength="1" x1="218.0" y1="33" x2="758.992" y2="33" stroke="#30363d" stroke-width="1" style="animation-delay:0.2s"/>
<g class="rise" style="animation-delay:0.30s"><text x="872" y="38" font-size="12.3" font-weight="400" fill="#9198a1" letter-spacing="0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">~/07-activity</text></g>
</svg>
